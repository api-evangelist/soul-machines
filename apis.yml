aid: soul-machines
name: Soul Machines
description: >-
  Soul Machines builds autonomously animated "Digital People" — AI-driven
  interactive avatars that combine a real-time facial/gesture animation engine
  with conversational AI so brands can deploy human-like agents for customer
  experience, sales, education, and health. Developers integrate Digital People
  through the Web SDK (a JavaScript library that renders and drives a Digital
  Person in the browser over a WebSocket session to the dh.soulmachines.cloud
  session server) and the Skills API (a REST/callback contract for building web
  services that supply the conversational responses a Digital Person speaks).
  Personas, API keys, and content are configured in DDNA Studio. Soul Machines
  was founded in Auckland, New Zealand and is a portfolio company of the SoftBank
  Vision Fund.
