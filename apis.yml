apis:
- name: Soul Machines Digital Person Session
  description: >-
    Real-time WebSocket session API used by the Web SDK to connect a browser
    client to a Digital Person running on the Soul Machines session server. A
    session is authenticated with either an API key (configured in DDNA Studio)
    or a JWT issued by a token server, then drives speech, animation, camera,
    and content-awareness over a message-based protocol.
  humanURL: https://docs.soulmachines.com/web-sdk/
  baseURL: https://dh.soulmachines.cloud
  properties:
  - type: Documentation
    url: https://docs.soulmachines.com/web-sdk/
  - type: APIReference
    url: https://docs.soulmachines.com/web-sdk/api/
  - type: WebSocketMessageFormats
    url: https://docs.soulmachines.com/docs/websocket-message-formats
- name: Soul Machines Skills API
  description: >-
    REST/callback contract for building web services ("skills") that respond to
    a Digital Person's conversational user input — NLP-adapter skills, intent
    matching, and pre/post processing stages. Skills are implemented by the
    developer and registered against a persona; official Node and Python SDKs
    conform requests/responses to the Skill API schema.
  humanURL: https://docs.soulmachines.com/skills-api/
  baseURL: https://docs.soulmachines.com/skills-api/
  properties:
  - type: Documentation
    url: https://docs.soulmachines.com/skills-api/
  - type: APIReference
    url: https://docs.soulmachines.com/skills-api/api-reference/skill-definition
  - type: GettingStarted
    url: https://docs.soulmachines.com/skills-api/getting-started/
